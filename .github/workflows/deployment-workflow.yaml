name: narrativestudies.lib.unb.ca

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  drupal:
    uses: unb-libraries/dockworker/.github/workflows/build-push-deploy-notify.yaml@6.x
    with:
      branch-env-map: '{"dev":"dev","prod":"prod"}'
      deploy-branches: '["dev","prod"]'
      image-name: 'ghcr.io/unb-libraries/narrativestudies.lib.unb.ca'
      k8s-deployment-name: 'narrativestudies-lib-unb-ca'
      # The Drupal 9 base image is published for amd64 only.
      platforms: 'linux/amd64'
      # No SCSS in this repository.
      build-themes: false
      # logs:check-file requires dockworker 6.x tooling.
      run-log-check: false
    secrets:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_DATA }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GH_CONTAINER_REGISTRY_USER: ${{ secrets.GH_CONTAINER_REGISTRY_USER }}
      GH_CONTAINER_REGISTRY_TOKEN: ${{ secrets.GH_CONTAINER_REGISTRY_TOKEN }}
