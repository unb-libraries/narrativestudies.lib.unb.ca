# The search form, wherever it appears; sends searches to the search page.
form:
  js:
    js/search-common.js: {}
    js/search.js: {}
  css:
    component:
      css/search.css: {}
  dependencies:
    - core/drupalSettings
# The search itself, on the search pages.
search:
  js:
    js/lunr.min.js: { minified: true }
  dependencies:
    - ns_search/form
